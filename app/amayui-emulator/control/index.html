<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
    <title>amayui-emulator 控制</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #ddd; margin: 0; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 12px; color: #eee; }
      .row { margin: 8px 0; }
      .label { color: #8a8a8a; font-size: 12px; margin-right: 6px; }
      .value { color: #7cfc00; font-family: ui-monospace, monospace; }
      button {
        background: #333; color: #eee; border: 1px solid #555; border-radius: 4px;
        padding: 6px 12px; font-size: 13px; cursor: pointer; margin-right: 8px;
      }
      button:hover { background: #444; }
      #btnTraceAll.on { background: #2d5f2d; border-color: #4a9a4a; }
      .ignored-list { max-height: 260px; overflow: auto; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font-family: ui-monospace, monospace; font-size: 12px; background: #161616; }
      .ignored-list div { padding: 1px 0; }
      .error { display: none; color: #ff6b6b; background: #3a1414; border: 1px solid #7a2e2e; border-radius: 4px; padding: 6px 8px; font-size: 12px; word-break: break-all; }
      .error.show { display: block; }
    </style>
  </head>
  <body>
    <h1>amayui-emulator 控制</h1>
    <div class="row">
      <button id="btnRestart">重启</button><span class="label">重启主窗口整个流程</span>
    </div>
    <div class="row">
      <button id="btnTraceAll" class="toggle">启用指令日志：关（仅未知）</button>
    </div>
    <div class="row"><span class="label">当前 BIN</span><span class="value" id="bin">…</span></div>
    <div class="row"><div class="error" id="error"></div></div>
    <div class="row">
      <span class="label">已忽略指令（去重）</span><span class="value" id="ignoredCount">(…)</span>
    </div>
    <div class="row ignored-list" id="ignored"></div>
    <script src="./control.js"></script>
  </body>
</html>
