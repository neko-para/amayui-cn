<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" />
    <title>amayui-emulator 控制</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #1e1e1e; color: #ddd; margin: 0; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 12px; color: #eee; }
      .row { margin: 8px 0; }
      .label { color: #8a8a8a; font-size: 12px; margin-right: 6px; }
      .value { color: #7cfc00; font-family: ui-monospace, monospace; }
      button {
        background: #333; color: #eee; border: 1px solid #555; border-radius: 4px;
        padding: 6px 12px; font-size: 13px; cursor: pointer; margin-right: 8px;
      }
      button:hover { background: #444; }
      button:disabled { opacity: .55; cursor: default; }
      #btnTraceAll.on { background: #2d5f2d; border-color: #4a9a4a; }
      .ignored-list { max-height: 200px; overflow: auto; border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font-family: ui-monospace, monospace; font-size: 12px; background: #161616; }
      .ignored-list div { padding: 1px 0; }
      .error { display: none; color: #ff6b6b; background: #3a1414; border: 1px solid #7a2e2e; border-radius: 4px; padding: 6px 8px; font-size: 12px; word-break: break-all; }
      .error.show { display: block; }
      /* 未知指令：可跳过（作为桩函数）——暂停时高亮显示 */
      .unknown { border: 1px solid #8a6d1f; background: #2b2410; border-radius: 4px; padding: 8px; }
      .unknown[hidden] { display: none; }
      .unknown .title { color: #ffcf5c; font-size: 13px; margin-bottom: 6px; }
      .unknown .info { font-family: ui-monospace, monospace; font-size: 12px; color: #ffe9a8; word-break: break-all; }
      .unknown .hint { color: #b9a86a; font-size: 11px; margin: 6px 0 8px; }
      #btnSkipUnknown { background: #6b5410; border-color: #a8842a; color: #fff3cf; font-weight: 600; }
      #btnSkipUnknown:hover:not(:disabled) { background: #856a16; }
    </style>
  </head>
  <body>
    <h1>amayui-emulator 控制</h1>
    <div class="row">
      <button id="btnRestart">重启</button><span class="label">重启主窗口整个流程</span>
    </div>
    <div class="row">
      <button id="btnTraceAll" class="toggle">启用指令日志：关（仅未知）</button>
    </div>
    <div class="row"><span class="label">当前 BIN</span><span class="value" id="bin">…</span></div>
    <div class="row"><div class="error" id="error"></div></div>
    <div class="row unknown" id="unknownBlock" hidden>
      <div class="title">⏸ 遇到不认识的指令，已停住</div>
      <div class="info" id="unknownInfo">…</div>
      <div class="hint" id="unknownHint"></div>
      <button id="btnSkipUnknown">作为桩函数跳过并继续</button>
    </div>
    <div class="row">
      <span class="label">已跳过指令（作为桩函数，去重）</span><span class="value" id="skippedCount">(…)</span>
    </div>
    <div class="row ignored-list" id="skipped"></div>
    <div class="row">
      <span class="label">已忽略指令（去重）</span><span class="value" id="ignoredCount">(…)</span>
    </div>
    <div class="row ignored-list" id="ignored"></div>
    <script src="./control.js"></script>
  </body>
</html>
